[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pl-pii-bench"
version = "0.1.0"
description = "Clean-room scoring harness and open baseline adapters for the pl-pii-bench public Polish PII benchmark."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "pytest>=7",
]
presidio = [
    "presidio-analyzer==2.2.360",
    "spacy==3.8.13",
    "click>=8.0",
]
spacy-pl = [
    "spacy==3.8.13",
    "click>=8.0",
]
gliner-pii-polish = [
    "gliner==0.2.21",
    "transformers==4.57.6",
]
bardsai-eu-pii = [
    "torch==2.8.0",
    "transformers==4.57.6",
]

[tool.hatch.build.targets.wheel]
packages = ["eval", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
